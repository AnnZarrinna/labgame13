<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Однорукий бандит</title>
  <script src="script.js"defer></script>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

:root {
  --cell-bg: #ffffff;    
  --cell-border: #ffb6c1; 
  --accent-color: #ff69b4;  
  --accent-hover: #ff1493;   
  --text-color: #4a2e35;     
  --subtext-color: #8b008b;  
  --win-color: #ffD700;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(135deg, #fff0f5 0%, #ffc0cb 50%, #ffe4e1 100%);
  color: var(--text-color);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(15px);
  border: 2px solid rgba(255, 182, 193, 0.7);
  border-radius: 30px;
  padding: 30px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 40px rgba(255, 105, 180, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.9);
  text-align: center;
  position: relative;
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Посилання "На головну" — вирівняне ліворуч */
.back-link {
  align-self: flex-start;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  color: #d81b60;
  margin-bottom: 12px;
  display: block;
  text-align: left;
  transition: all 0.3s ease;
}

.back-link:hover {
  color: #ff1493;
  transform: translateX(-3px);
}

h2 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #4a2e35;
  word-break: break-word;
}

#attempts {
  font-size: 15px;
  color: var(--subtext-color);
  margin-bottom: 20px;
  font-weight: 600;
  font-style: italic;
}

.generate-btn {
  background: linear-gradient(135deg, #ff69b4, #ff1493);
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 36px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  margin-bottom: 22px;
  width: 100%;
  font-family: 'Quicksand', sans-serif;
}
.generate-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 20, 147, 0.6);
}
.generate-btn:disabled {
  background: #e0e0e0;
  color: #a0a0a0;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.slot-machine {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  background-color: rgba(255, 240, 245, 0.6);
  padding: 16px;
  border: 2px solid #ffb6c1;
  border-radius: 20px;
  box-shadow: inset 0 2px 8px rgba(255, 182, 193, 0.3);
}
.cell {
  background-color: var(--cell-bg);
  border: 2px solid var(--cell-border);
  border-radius: 14px;
  height: 85px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.3s, background-color 0.3s;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(255, 182, 193, 0.15);
}
.cell svg {
  width: 50px;
  height: 50px;
  transition: transform 0.2s;
}
.cell.spinning svg {
  filter: blur(2px);
  transform: scale(0.9);
}
.cell.win {
  border-color: var(--win-color);
  background-color: rgba(255, 215, 0, 0.15);
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.03); }
}
.message {
  margin-top: 18px;
  font-size: 15px;
  font-weight: 700;
  min-height: 24px;
}
.message.win { color: #c71585; }
.message.lose { color: #8b0000; }
  </style>
</head>
<div class="container">
    <a href="../index.html" class="back-link">← На головну</a>
    <h2 id="userName">User 💖</h2>
    <div id="attempts">Спроба 0 з 3</div>
    <button id="generateBtn" class="generate-btn" onclick="playSlot()">Generate ✨</button>
    <div class="slot-machine">
      <div class="cell" id="c0"></div>
      <div class="cell" id="c1"></div>
      <div class="cell" id="c2"></div>
      <div class="cell" id="c3"></div>
      <div class="cell" id="c4"></div>
      <div class="cell" id="c5"></div>
      <div class="cell" id="c6"></div>
      <div class="cell" id="c7"></div>
      <div class="cell" id="c8"></div>
    </div>

    <div id="statusMessage" class="message"></div>
  </div>
</body>
</html>
